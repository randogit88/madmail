name: Build Madmail for D-Link ARMv7

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-armv7:
    name: Build ARMv7 Musl Static Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf musl-tools
          cargo install cargo-zigbuild

      - name: Build Madmail Statically for ARMv7
        run: |
          cargo zigbuild -p chatmail --release --target armv7-unknown-linux-musleabihf
          mkdir -p dist
          cp target/armv7-unknown-linux-musleabihf/release/madmail dist/madmail-dlink-armv7
          chmod +x dist/madmail-dlink-armv7

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madmail-dlink-armv7
          path: dist/madmail-dlink-armv7
          retention-days: 7
